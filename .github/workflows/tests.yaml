on:
  pull_request:
    branches:
      - master

name: Run tests

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.7"
      - run: python -m pip install -e .[test]
      - run: python -m pytest
